name: Test Anchor

on:
  push:
    branches: ['release/*', 'devel']
  pull_request:
    branches: ['devel']

env:
  HUSKY: 0

jobs:
  anchor-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Anchor Test
        uses: mrgnlabs/anchor-test-action@v0.5
        with:
          args: ''
          workspace_dir: './anchor'
