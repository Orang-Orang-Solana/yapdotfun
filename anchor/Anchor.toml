[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
basic = "DL3maGWRfpBWRrgesM1AxYwfpkgRtoskW3Fxw3MbhApi"
yapping = "Ci7oP5iPr7C3EStsLMo1U6twvaquLH9EkfCKYedeishi"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "../node_modules/.bin/jest --preset ts-jest"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = "../test-ledger"
rpc_port = 8899
